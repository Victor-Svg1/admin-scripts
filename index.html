<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Central de Scripts — Admin</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#0A0A0A;--s1:#111;--s2:#1A1A1A;--s3:#222;--b:#2A2A2A;--b2:#333;--t:#F0F0F0;--t2:#999;--t3:#555;--g:#22C55E;--gd:#16A34A;--o:#F59E0B;--r:#EF4444;--bl:#3B82F6;--pu:#A855F7;--r8:8px;--r12:12px;--tr:all .15s}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;min-height:100vh}
a{color:inherit;text-decoration:none}

/* LOGIN */
#login{display:none;align-items:center;justify-content:center;min-height:100vh;background:var(--bg)}
.login-box{background:var(--s1);border:1px solid var(--b);border-radius:16px;padding:40px;width:100%;max-width:380px}
.login-logo{font-size:20px;font-weight:800;margin-bottom:28px;display:flex;align-items:center;gap:8px}
.login-logo span{width:8px;height:8px;border-radius:50%;background:var(--g);box-shadow:0 0 8px var(--g);display:inline-block}
.lg{display:block;font-size:11px;font-weight:600;color:var(--t2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px}
.fi{width:100%;background:var(--bg);border:1px solid var(--b);border-radius:var(--r8);padding:10px 14px;color:var(--t);font-size:14px;outline:none;transition:var(--tr);margin-bottom:12px}
.fi:focus{border-color:var(--g)}
.err{font-size:13px;color:var(--r);margin-bottom:12px;display:none}

/* LAYOUT */
#app{display:none;min-height:100vh}
#app.show{display:flex;flex-direction:column}
.topbar{background:var(--s1);border-bottom:1px solid var(--b);padding:0 24px;height:52px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:100}
.brand{font-weight:800;font-size:15px;display:flex;align-items:center;gap:7px}
.brand-dot{width:7px;height:7px;border-radius:50%;background:var(--g);box-shadow:0 0 6px var(--g)}
.nav{display:flex;gap:2px;flex:1;margin-left:8px}
.nav-item{padding:6px 14px;border-radius:6px;font-size:13px;font-weight:500;color:var(--t2);cursor:pointer;transition:var(--tr);border:none;background:transparent;display:flex;align-items:center;gap:6px}
.nav-item:hover{color:var(--t);background:var(--s2)}
.nav-item.active{color:var(--t);background:var(--s3);font-weight:600}
.nav-item svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.topbar-right{display:flex;align-items:center;gap:8px;margin-left:auto}
.logout-btn{padding:6px 14px;border:1px solid var(--b);border-radius:6px;background:transparent;color:var(--t2);font-size:13px;cursor:pointer;transition:var(--tr)}
.logout-btn:hover{color:var(--r);border-color:var(--r)}
.main{flex:1;padding:24px;max-width:1400px;margin:0 auto;width:100%}

/* BTN */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--r8);font-size:13px;font-weight:600;cursor:pointer;border:none;transition:var(--tr)}
.btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn-g{background:var(--g);color:#000}.btn-g:hover{background:var(--gd)}
.btn-ghost{background:transparent;color:var(--t2);border:1px solid var(--b)}.btn-ghost:hover{color:var(--t);border-color:var(--b2)}
.btn-danger{background:rgba(239,68,68,.1);color:var(--r);border:1px solid rgba(239,68,68,.2)}.btn-danger:hover{background:rgba(239,68,68,.2)}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-blue{background:rgba(59,130,246,.15);color:var(--bl);border:1px solid rgba(59,130,246,.2)}.btn-blue:hover{background:rgba(59,130,246,.25)}

/* CARDS */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
.stat{background:var(--s1);border:1px solid var(--b);border-radius:var(--r12);padding:18px 20px}
.stat-label{font-size:11px;font-weight:600;color:var(--t2);text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px}
.stat-val{font-size:28px;font-weight:800;letter-spacing:-.03em;line-height:1}
.stat-sub{font-size:12px;color:var(--t3);margin-top:4px}
.stat-trend{font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:20px;margin-top:6px}
.trend-up{background:rgba(34,197,94,.12);color:var(--g)}
.trend-dn{background:rgba(239,68,68,.12);color:var(--r)}

/* SECTIONS */
.section{background:var(--s1);border:1px solid var(--b);border-radius:var(--r12);margin-bottom:16px}
.sec-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--b);flex-wrap:wrap;gap:10px}
.sec-title{font-size:14px;font-weight:700}
.sec-body{padding:20px}
.sec-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}

/* CHARTS */
.chart-wrap{position:relative;height:220px}
canvas{border-radius:8px}

/* TABLE */
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.search-wrap{position:relative;flex:1;min-width:200px}
.search-ico{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--t3)}
.search-ico svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
.search-inp{width:100%;background:var(--s2);border:1px solid var(--b);border-radius:var(--r8);padding:8px 12px 8px 32px;color:var(--t);font-size:13px;outline:none;transition:var(--tr)}
.search-inp:focus{border-color:var(--g)}
.filter-btn{padding:7px 14px;border-radius:20px;border:1px solid var(--b);background:transparent;color:var(--t2);font-size:12px;font-weight:600;cursor:pointer;transition:var(--tr)}
.filter-btn.on,.filter-btn:hover{border-color:var(--g);color:var(--g);background:rgba(34,197,94,.08)}
.period-btn{padding:6px 12px;border-radius:20px;border:1px solid var(--b);background:transparent;color:var(--t2);font-size:12px;font-weight:600;cursor:pointer;transition:var(--tr)}
.period-btn.on{border-color:var(--g);color:var(--g);background:rgba(34,197,94,.1)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;font-weight:600;color:var(--t2);text-transform:uppercase;letter-spacing:.06em;padding:8px 12px;border-bottom:1px solid var(--b)}
td{padding:10px 12px;border-bottom:1px solid var(--b);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,.015)}
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.badge-g{background:rgba(34,197,94,.15);color:var(--g)}
.badge-r{background:rgba(239,68,68,.12);color:var(--r)}
.badge-o{background:rgba(245,158,11,.12);color:var(--o)}
.badge-b{background:rgba(59,130,246,.12);color:var(--bl)}
.badge-p{background:rgba(168,85,247,.12);color:var(--pu)}
.td-actions{display:flex;gap:6px;flex-wrap:wrap}

/* BULK BAR */
.bulk-bar{background:var(--s2);border:1px solid var(--b);border-radius:10px;padding:10px 16px;display:none;align-items:center;gap:12px;margin-bottom:12px}
.bulk-bar.show{display:flex}
.bulk-sep{width:1px;height:18px;background:var(--b)}

/* PAGINATION */
.pagination{display:flex;align-items:center;justify-content:space-between;padding-top:16px;border-top:1px solid var(--b)}
.page-info{font-size:12px;color:var(--t2)}
.page-btns{display:flex;gap:6px}
.page-btn{padding:5px 12px;border-radius:6px;border:1px solid var(--b);background:transparent;color:var(--t2);font-size:12px;cursor:pointer;transition:var(--tr)}
.page-btn:hover,.page-btn.on{background:var(--s3);color:var(--t);border-color:var(--b2)}
.page-btn:disabled{opacity:.3;cursor:default}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);backdrop-filter:blur(4px);z-index:200;display:flex;align-items:flex-start;justify-content:center;padding:40px 20px;overflow-y:auto;opacity:0;pointer-events:none;transition:opacity .2s}
.overlay.open{opacity:1;pointer-events:all}
.modal{background:var(--s1);border:1px solid var(--b);border-radius:16px;width:100%;max-width:560px;padding:24px;transform:translateY(16px);transition:transform .2s}
.overlay.open .modal{transform:translateY(0)}
.modal-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.modal-title{font-size:17px;font-weight:800}
.modal-x{background:none;border:none;color:var(--t2);cursor:pointer;padding:4px}
.modal-x svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}
.fg{margin-bottom:14px}
.fl{display:block;font-size:11px;font-weight:600;color:var(--t2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px}
.fs{width:100%;background:var(--bg);border:1px solid var(--b);border-radius:var(--r8);padding:9px 12px;color:var(--t);font-size:14px;font-family:inherit;outline:none;transition:var(--tr)}
.fs:focus{border-color:var(--g)}
select.fs option{background:var(--s1)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal-ftr{display:flex;gap:10px;justify-content:flex-end;padding-top:18px;margin-top:4px;border-top:1px solid var(--b)}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--bg);border-radius:var(--r8);border:1px solid var(--b)}
.tl{font-size:13px;font-weight:600}
.toggle-sw{position:relative;width:42px;height:22px;flex-shrink:0}
.toggle-sw input{opacity:0;width:0;height:0}
.tslider{position:absolute;inset:0;background:var(--b);border-radius:11px;cursor:pointer;transition:.2s}
.tslider::before{content:'';position:absolute;width:16px;height:16px;background:#fff;border-radius:50%;top:3px;left:3px;transition:.2s}
.toggle-sw input:checked+.tslider{background:var(--g)}
.toggle-sw input:checked+.tslider::before{transform:translateX(20px)}

/* CRON */
.cron-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.cron-card{background:var(--s2);border:1px solid var(--b);border-radius:var(--r8);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.cron-info{flex:1}
.cron-name{font-size:13px;font-weight:700;margin-bottom:3px}
.cron-desc{font-size:11px;color:var(--t2)}
.cron-status{width:8px;height:8px;border-radius:50%;background:var(--g);flex-shrink:0}
.cron-status.running{animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}

/* TOAST */
.toast{position:fixed;bottom:20px;right:20px;background:var(--s1);border:1px solid var(--b);border-radius:10px;padding:12px 18px;font-size:13px;font-weight:500;z-index:999;transform:translateY(20px);opacity:0;transition:all .25s;max-width:300px;pointer-events:none}
.toast.show{transform:translateY(0);opacity:1}
.toast.ok{border-color:var(--g);color:var(--g)}
.toast.err{border-color:var(--r);color:var(--r)}
.toast.warn{border-color:var(--o);color:var(--o)}

/* EXPIRY ALERT */
.expiry-chip{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700;background:rgba(239,68,68,.12);color:var(--r)}
.expiry-soon{background:rgba(245,158,11,.12);color:var(--o)}

/* CONTENT TAB */
.content-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.content-card{background:var(--s2);border:1px solid var(--b);border-radius:var(--r12);overflow:hidden;transition:var(--tr)}
.content-card:hover{border-color:var(--b2)}
.cc-thumb{width:100%;height:130px;background:var(--s3);display:flex;align-items:center;justify-content:center;font-size:32px;position:relative;overflow:hidden}
.cc-thumb img{width:100%;height:100%;object-fit:cover}
.cc-body{padding:14px}
.cc-cat{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--t3);margin-bottom:4px}
.cc-title{font-size:14px;font-weight:700;margin-bottom:4px;line-height:1.3}
.cc-desc{font-size:12px;color:var(--t2);line-height:1.5;margin-bottom:10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cc-actions{display:flex;gap:6px;flex-wrap:wrap}

@media(max-width:768px){.stat-grid{grid-template-columns:repeat(2,1fr)}.sec-row{grid-template-columns:1fr}.nav{overflow-x:auto}.nav-item span{display:none}}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <div class="login-box">
    <div class="login-logo"><span></span>Central de Scripts</div>
    <div class="err" id="loginErr"></div>
    <label class="lg">Email</label>
    <input class="fi" id="lEmail" type="email" placeholder="admin@centralscripts.com.br">
    <label class="lg">Senha</label>
    <input class="fi" id="lPass" type="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="btn btn-g" style="width:100%;justify-content:center;padding:11px" onclick="doLogin()" id="loginBtn">Entrar →</button>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="topbar">
    <div class="brand"><div class="brand-dot"></div>Admin</div>
    <nav class="nav">
      <button class="nav-item active" data-tab="dashboard" onclick="goTab('dashboard',this)">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        <span>Dashboard</span>
      </button>
      <button class="nav-item" data-tab="users" onclick="goTab('users',this)">
        <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
        <span>Usuários</span>
      </button>
      <button class="nav-item" data-tab="scripts" onclick="goTab('scripts',this)">
        <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
        <span>Scripts</span>
      </button>
      <button class="nav-item" data-tab="metrics" onclick="goTab('metrics',this)">
        <svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        <span>Métricas</span>
      </button>
      <button class="nav-item" data-tab="conteudo" onclick="goTab('conteudo',this)">
        <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        <span>Conteúdo</span>
      </button>
      <button class="nav-item" data-tab="crons" onclick="goTab('crons',this)">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <span>Crons</span>
      </button>
      <button class="nav-item" data-tab="webhooks" onclick="goTab('webhooks',this)">
        <svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        <span>Webhooks</span>
      </button>
    </nav>
    <div class="topbar-right">
      <span style="font-size:12px;color:var(--t2)" id="adminEmail"></span>
      <button class="logout-btn" onclick="logout()">Sair</button>
    </div>
  </div>
  <div class="main" id="mainContent"></div>
</div>

<div class="overlay" id="overlay"><div class="modal" id="modalBox"></div></div>
<div class="toast" id="toast"></div>

<script>
const API = 'https://central-scripts-backend-production.up.railway.app';
let TOKEN = localStorage.getItem('csa_token') || '';
let ADMIN = null;
let currentTab = 'dashboard';
let metricsDays = 30;
let userPage = 1, userSearch = '', userFilter = 'all';
let bulkMode = false, selectedUsers = new Set();
let scriptSearch = '', scriptPage = 1;
let contentSearch = '', contentFilter = 'all';
let chartInstances = {};

// ── INIT ────────────────────────────────────────────────────────
window.onload = () => {
  if (TOKEN) showApp();
  else showLogin();
};

function showLogin() { document.getElementById('login').style.display = 'flex'; }
function showApp() {
  document.getElementById('login').style.display = 'none';
  document.getElementById('app').classList.add('show');
  renderTab('dashboard');
}

// ── AUTH ────────────────────────────────────────────────────────
async function doLogin() {
  const email = document.getElementById('lEmail').value.trim();
  const pass = document.getElementById('lPass').value;
  const err = document.getElementById('loginErr');
  const btn = document.getElementById('loginBtn');
  if (!email || !pass) { err.textContent = 'Preencha todos os campos'; err.style.display = 'block'; return; }
  btn.textContent = 'Entrando...'; btn.disabled = true;
  try {
    const d = await apiFetch('/auth/admin-login', 'POST', { email, password: pass });
    if (!d || !d.token) throw new Error(d?.error || 'Credenciais inválidas');
    TOKEN = d.token; ADMIN = d.admin;
    localStorage.setItem('csa_token', TOKEN);
    document.getElementById('adminEmail').textContent = email;
    showApp();
  } catch(e) { err.textContent = e.message; err.style.display = 'block'; }
  finally { btn.textContent = 'Entrar →'; btn.disabled = false; }
}

function logout() {
  TOKEN = ''; localStorage.removeItem('csa_token');
  document.getElementById('app').classList.remove('show');
  document.getElementById('login').style.display = 'flex';
}

// ── API ──────────────────────────────────────────────────────────
async function apiFetch(path, method = 'GET', body) {
  const r = await fetch(API + path, {
    method,
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + TOKEN },
    body: body ? JSON.stringify(body) : undefined
  });
  if (r.status === 401) { logout(); return null; }
  return r.json();
}

// ── TABS ─────────────────────────────────────────────────────────
function goTab(tab, el) {
  currentTab = tab;
  document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
  (el || document.querySelector('[data-tab="' + tab + '"]'))?.classList.add('active');
  renderTab(tab);
}

function renderTab(tab) {
  Object.values(chartInstances).forEach(c => c.destroy());
  chartInstances = {};
  const el = document.getElementById('mainContent');
  el.innerHTML = '<div style="color:var(--t2);padding:40px;text-align:center">Carregando...</div>';
  const fn = { dashboard: renderDashboard, users: renderUsers, scripts: renderScripts, metrics: renderMetrics, conteudo: renderConteudo, crons: renderCrons, webhooks: renderWebhooks }[tab];
  if (fn) fn(el);
}

// ── DASHBOARD ────────────────────────────────────────────────────
async function renderDashboard(el) {
  const d = await apiFetch('/admin/dashboard');
  if (!d) return;
  const mrr = ((d.byPlan?.mensal || 0) * 29.9 + (d.byPlan?.anual || 0) * (299.9 / 12)).toFixed(2).replace('.', ',');
  const expiringCount = d.expiringThisWeek || 0;

  el.innerHTML = `
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px">
    <div style="font-size:20px;font-weight:800">Dashboard</div>
    <div style="font-size:12px;color:var(--t2)">Atualizado agora</div>
  </div>

  <div class="stat-grid">
    <div class="stat">
      <div class="stat-label">Membros ativos</div>
      <div class="stat-val" style="color:var(--g)">${d.activeUsers ?? '—'}</div>
      <div class="stat-sub">de ${d.totalUsers ?? '—'} totais</div>
    </div>
    <div class="stat">
      <div class="stat-label">MRR estimado</div>
      <div class="stat-val" style="color:var(--o)">R$${mrr}</div>
      <div class="stat-sub">receita mensal recorrente</div>
    </div>
    <div class="stat">
      <div class="stat-label">Scripts copiados</div>
      <div class="stat-val">${d.totalCopies ?? '—'}</div>
      <div class="stat-sub">total acumulado</div>
    </div>
    <div class="stat">
      <div class="stat-label" style="${expiringCount > 0 ? 'color:var(--r)' : ''}">Expirando esta semana</div>
      <div class="stat-val" style="${expiringCount > 0 ? 'color:var(--r)' : ''}">${expiringCount}</div>
      <div class="stat-sub"><button class="btn btn-sm btn-danger" style="margin-top:4px" onclick="goTab('users',null);setTimeout(()=>setUserFilter('expiring'),300)">Ver usuários →</button></div>
    </div>
  </div>

  <div class="sec-row">
    <div class="section">
      <div class="sec-head"><div class="sec-title">Distribuição por plano</div></div>
      <div class="sec-body"><div class="chart-wrap"><canvas id="planChart"></canvas></div></div>
    </div>
    <div class="section">
      <div class="sec-head"><div class="sec-title">Novos membros (últimos 30 dias)</div></div>
      <div class="sec-body"><div class="chart-wrap"><canvas id="growthChart"></canvas></div></div>

// ── USERS ─────────────────────────────────────────────────────────
async function renderUsers(el) {
  const params = new URLSearchParams({ page: userPage, limit: 20, search: userSearch });
  if (userFilter === 'active') params.set('active', 'true');
  if (userFilter === 'inactive') params.set('active', 'false');
  if (userFilter === 'expiring') params.set('expiring', '7');
  const d = await apiFetch('/admin/users?' + params);
  if (!d) return;

  const users = d.users || [];
  const total = d.total || users.length;
  const pages = Math.ceil(total / 20);

  el.innerHTML = `
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px">
    <div style="font-size:20px;font-weight:800">Usuários <span style="font-size:14px;font-weight:400;color:var(--t2)">(${total})</span></div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-ghost btn-sm" onclick="exportUsersCSV()">
        <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Exportar CSV
      </button>
      <button class="btn btn-ghost btn-sm" onclick="toggleBulkMode()" id="bulkBtn">☑ Selecionar</button>
      <button class="btn btn-g btn-sm" onclick="openCreateUser()">+ Novo usuário</button>
    </div>
  </div>

  <div class="bulk-bar ${bulkMode && selectedUsers.size ? 'show' : ''}" id="bulkBar">
    <span style="font-size:13px;font-weight:600" id="bulkCount">${selectedUsers.size} selecionados</span>
    <div class="bulk-sep"></div>
    <button class="btn btn-ghost btn-sm" onclick="bulkToggle(true)">✅ Ativar todos</button>
    <button class="btn btn-ghost btn-sm" onclick="bulkToggle(false)">⬜ Desativar todos</button>
    <div class="bulk-sep"></div>
    <button class="btn btn-danger btn-sm" onclick="bulkExtend()">📅 Estender 30 dias</button>
    <span style="flex:1"></span>
    <button class="btn btn-ghost btn-sm" onclick="clearBulk()">Cancelar</button>
  </div>

  <div class="controls">
    <div class="search-wrap">
      <span class="search-ico"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg></span>
      <input class="search-inp" placeholder="Buscar por nome ou email..." value="${userSearch}" oninput="userSearch=this.value;userPage=1;debounce(()=>renderUsers(document.getElementById('mainContent')),300)">
    </div>
    <button class="filter-btn ${userFilter==='all'?'on':''}" onclick="setUserFilter('all')">Todos</button>
    <button class="filter-btn ${userFilter==='active'?'on':''}" onclick="setUserFilter('active')">Ativos</button>
    <button class="filter-btn ${userFilter==='inactive'?'on':''}" onclick="setUserFilter('inactive')">Inativos</button>
    <button class="filter-btn ${userFilter==='expiring'?'on':''}" onclick="setUserFilter('expiring')" style="${userFilter==='expiring'?'':'color:var(--r);border-color:rgba(239,68,68,.3)'}">⚠ Expirando</button>
  </div>

  <div class="section">
    <table>
      <thead><tr>
        ${bulkMode ? '<th><input type="checkbox" onchange="toggleAllUsers(this.checked)"></th>' : ''}
        <th>Nome</th><th>Email</th><th>Plano</th><th>Expira em</th><th>Status</th><th>Ações</th>
      </tr></thead>
      <tbody>${users.map(u => {
        const exp = u.plan_expires ? new Date(u.plan_expires) : null;
        const daysLeft = exp ? Math.ceil((exp - Date.now()) / 86400000) : null;
        const expiryChip = daysLeft !== null ? (daysLeft <= 0 ? '<span class="expiry-chip">Expirado</span>' : daysLeft <= 7 ? `<span class="expiry-chip expiry-soon">${daysLeft}d</span>` : `<span style="color:var(--t2)">${daysLeft}d</span>`) : '—';
        return `<tr>
          ${bulkMode ? `<td><input type="checkbox" ${selectedUsers.has(u.id)?'checked':''} onchange="toggleUserSelect('${u.id}',this.checked)"></td>` : ''}
          <td style="font-weight:600">${u.name || '—'}</td>
          <td style="color:var(--t2)">${u.email}</td>
          <td><span class="badge ${u.plan==='anual'?'badge-p':'badge-b'}">${u.plan||'mensal'}</span></td>
          <td>${expiryChip}</td>
          <td><span class="badge ${u.active?'badge-g':'badge-r'}">${u.active?'Ativo':'Inativo'}</span></td>
          <td class="td-actions">
            <button class="btn btn-ghost btn-sm" onclick="openUserModal('${u.id}')">✏️</button>
            <button class="btn btn-ghost btn-sm" onclick="toggleUser('${u.id}',${!u.active})">${u.active?'Desativar':'Ativar'}</button>
            <button class="btn btn-ghost btn-sm" onclick="resetPassword('${u.id}')">🔑</button>
          </td>
        </tr>`;
      }).join('')}</tbody>
    </table>
    <div class="pagination">
      <div class="page-info">Página ${userPage} de ${pages} (${total} usuários)</div>
      <div class="page-btns">
        <button class="page-btn" onclick="userPage--;renderUsers(document.getElementById('mainContent'))" ${userPage<=1?'disabled':''}>← Ant</button>
        <button class="page-btn" onclick="userPage++;renderUsers(document.getElementById('mainContent'))" ${userPage>=pages?'disabled':''}>Próx →</button>
      </div>
    </div>
  </div>`;
}

function setUserFilter(f) { userFilter = f; userPage = 1; renderUsers(document.getElementById('mainContent')); }

function exportUsersCSV() {
  apiFetch('/admin/users?limit=9999').then(d => {
    if (!d) return;
    const rows = [['Nome','Email','Plano','Ativo','Expira']];
    (d.users||[]).forEach(u => rows.push([u.name||'',u.email,u.plan||'',u.active?'sim':'não',u.plan_expires||'']));
    const csv = rows.map(r => r.map(c => '"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
    const a = document.createElement('a');
    a.href = 'data:text/csv;charset=utf-8,\uFEFF'+encodeURIComponent(csv);
    a.download = 'usuarios_'+new Date().toISOString().slice(0,10)+'.csv';
    a.click();
    toast('CSV exportado!', 'ok');
  });
}

function toggleBulkMode() { bulkMode = !bulkMode; selectedUsers.clear(); renderUsers(document.getElementById('mainContent')); }
function toggleUserSelect(id, checked) { checked ? selectedUsers.add(id) : selectedUsers.delete(id); document.getElementById('bulkCount').textContent = selectedUsers.size + ' selecionados'; document.getElementById('bulkBar').classList.toggle('show', selectedUsers.size > 0); }
function toggleAllUsers(checked) { document.querySelectorAll('tbody input[type=checkbox]').forEach(cb => { cb.checked = checked; const id = cb.closest('tr').querySelector('button')?.getAttribute('onclick')?.match(/'([^']+)'/)?.[1]; if (id) checked ? selectedUsers.add(id) : selectedUsers.delete(id); }); document.getElementById('bulkCount').textContent = selectedUsers.size + ' selecionados'; document.getElementById('bulkBar').classList.toggle('show', selectedUsers.size > 0); }
function clearBulk() { bulkMode = false; selectedUsers.clear(); renderUsers(document.getElementById('mainContent')); }

async function bulkToggle(active) {
  if (!selectedUsers.size) return;
  if (!confirm(`${active ? 'Ativar' : 'Desativar'} ${selectedUsers.size} usuário(s)?`)) return;
  await Promise.all([...selectedUsers].map(id => apiFetch('/admin/users/'+id, 'PUT', { active })));
  toast(selectedUsers.size + ' usuário(s) ' + (active ? 'ativados' : 'desativados'), 'ok');
  clearBulk();
}

async function bulkExtend() {
  if (!selectedUsers.size) return;
  if (!confirm(`Estender 30 dias para ${selectedUsers.size} usuário(s)?`)) return;
  await Promise.all([...selectedUsers].map(id => apiFetch('/admin/users/'+id+'/extend', 'POST', { days: 30 })));
  toast('Prazo estendido!', 'ok');
  clearBulk();
}

      <div class="fg"><label class="fl">Email</label><input class="fs" id="uEmail" value="${u.email||''}"></div>
    </div>
    <div class="row2">
      <div class="fg"><label class="fl">Plano</label><select class="fs" id="uPlan"><option value="mensal" ${u.plan==='mensal'?'selected':''}>Mensal</option><option value="anual" ${u.plan==='anual'?'selected':''}>Anual</option></select></div>
      <div class="fg"><label class="fl">Expira em</label><input class="fs" id="uExpires" type="date" value="${u.plan_expires?u.plan_expires.slice(0,10):''}"></div>

async function saveUser(id) {
  const body = { name: document.getElementById('uName').value.trim(), email: document.getElementById('uEmail').value.trim(), plan: document.getElementById('uPlan').value, plan_expires: document.getElementById('uExpires').value || null, active: document.getElementById('uActive').checked };
  const d = await apiFetch('/admin/users/'+id, 'PUT', body);
  if (d?.ok || d?.id || d?.user) { toast('Usuário atualizado!', 'ok'); closeModal(); renderUsers(document.getElementById('mainContent')); }
  else toast('Erro: '+(d?.error||'?'), 'err');
}

async function toggleUser(id, active) {
  await apiFetch('/admin/users/'+id, 'PUT', { active });
  toast(active ? 'Usuário ativado' : 'Usuário desativado', 'ok');
  renderUsers(document.getElementById('mainContent'));
}

async function resetPassword(id) {
  if (!confirm('Resetar a senha deste usuário?')) return;
  const d = await apiFetch('/admin/users/'+id+'/reset-password', 'POST');
  if (d?.tempPassword) toast('Senha temporária: '+d.tempPassword, 'ok');
  else toast('Senha resetada — verifique o email do usuário', 'ok');
}

async function openCreateUser() {
  openModal(`
    <div class="modal-hdr"><div class="modal-title">Criar usuário</div><button class="modal-x" onclick="closeModal()"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>

      <div class="fg"><label class="fl">Nome</label><input class="fs" id="cName" placeholder="Nome completo"></div>
      <div class="fg"><label class="fl">Email</label><input class="fs" id="cEmail" type="email" placeholder="email@exemplo.com"></div>
    </div>
    <div class="row2">
      <div class="fg"><label class="fl">Plano</label><select class="fs" id="cPlan"><option value="mensal">Mensal</option><option value="anual">Anual</option></select></div>
      <div class="fg"><label class="fl">Expira em</label><input class="fs" id="cExpires" type="date"></div>
    </div>
    <div class="modal-ftr">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>

async function createUser() {
  const body = { name: document.getElementById('cName').value.trim(), email: document.getElementById('cEmail').value.trim(), plan: document.getElementById('cPlan').value, plan_expires: document.getElementById('cExpires').value || null };

  if (d?.ok || d?.id || d?.user) { toast('Usuário criado!', 'ok'); closeModal(); renderUsers(document.getElementById('mainContent')); }
  else toast('Erro: '+(d?.error||'?'), 'err');
}

      datasets: [{ data: topScripts.map(s => s.copies || s.count || 0), backgroundColor: 'rgba(34,197,94,.7)', borderRadius: 4 }]
    },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { ticks: { color: '#555', font: { size: 10 } }, grid: { display: false } }, y: { ticks: { color: '#555' }, grid: { color: 'rgba(255,255,255,.04)' }, beginAtZero: true } } }
  });

  // Niches donut
  const nicheData = d.byNiche || {};
  const nicheKeys = Object.keys(nicheData).slice(0, 8);
  const colors = ['rgba(59,130,246,.8)','rgba(168,85,247,.8)','rgba(34,197,94,.8)','rgba(245,158,11,.8)','rgba(239,68,68,.8)','rgba(20,184,166,.8)','rgba(249,115,22,.8)','rgba(236,72,153,.8)'];
  chartInstances.niche = new Chart(document.getElementById('nicheChart'), {
    type: 'doughnut',
    data: { labels: nicheKeys, datasets: [{ data: nicheKeys.map(k => nicheData[k]), backgroundColor: colors, borderWidth: 0, hoverOffset: 6 }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right', labels: { color: '#999', padding: 12, font: { size: 11 } } } } }
  });
}

// ── CONTEÚDO (admin-members integrated) ──────────────────────────
async function renderConteudo(el) {
  const d = await apiFetch('/members-content/admin/list');
  const items = d?.items || [];
  const pub = items.filter(i => i.published).length;
  const cats = new Set(items.map(i => i.category).filter(Boolean)).size;

  const filtered = items.filter(i => {
    if (contentFilter === 'draft' && i.published) return false;
    if (!['all','draft'].includes(contentFilter) && i.type !== contentFilter) return false;
    if (contentSearch && !i.title.toLowerCase().includes(contentSearch.toLowerCase()) && !(i.category||'').toLowerCase().includes(contentSearch.toLowerCase())) return false;
    return true;
  });

  const typeIcons = {article:'📄',template:'📋',guide:'📖',video:'🎥'};
  const typeBadges = {article:'badge-g',template:'badge-b',guide:'badge-o',video:'badge-r'};
  const typeLabels = {article:'Artigo',template:'Template',guide:'Guia',video:'Vídeo'};

  el.innerHTML = `
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px">
    <div style="font-size:20px;font-weight:800">Conteúdo Exclusivo</div>
    <button class="btn btn-g btn-sm" onclick="openContentModal(null)">+ Novo conteúdo</button>
  </div>

  <div class="stat-grid" style="grid-template-columns:repeat(4,1fr);margin-bottom:20px">
    <div class="stat"><div class="stat-label">Total</div><div class="stat-val">${items.length}</div></div>
    <div class="stat"><div class="stat-label">Publicados</div><div class="stat-val" style="color:var(--g)">${pub}</div></div>
    <div class="stat"><div class="stat-label">Rascunhos</div><div class="stat-val" style="color:var(--o)">${items.length - pub}</div></div>
    <div class="stat"><div class="stat-label">Categorias</div><div class="stat-val">${cats}</div></div>
  </div>

  <div class="controls">
    <div class="search-wrap">
      <span class="search-ico"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg></span>
      <input class="search-inp" placeholder="Buscar conteúdo..." value="${contentSearch}" oninput="contentSearch=this.value;renderConteudo(document.getElementById('mainContent'))">
    </div>
    <button class="filter-btn ${contentFilter==='all'?'on':''}" onclick="contentFilter='all';renderConteudo(document.getElementById('mainContent'))">Todos</button>
    <button class="filter-btn ${contentFilter==='article'?'on':''}" onclick="contentFilter='article';renderConteudo(document.getElementById('mainContent'))">Artigos</button>
    <button class="filter-btn ${contentFilter==='template'?'on':''}" onclick="contentFilter='template';renderConteudo(document.getElementById('mainContent'))">Templates</button>
    <button class="filter-btn ${contentFilter==='guide'?'on':''}" onclick="contentFilter='guide';renderConteudo(document.getElementById('mainContent'))">Guias</button>
    <button class="filter-btn ${contentFilter==='video'?'on':''}" onclick="contentFilter='video';renderConteudo(document.getElementById('mainContent'))">Vídeos</button>
    <button class="filter-btn ${contentFilter==='draft'?'on':''}" onclick="contentFilter='draft';renderConteudo(document.getElementById('mainContent'))">Rascunhos</button>
  </div>

  <div class="content-grid">${filtered.length ? filtered.map(i => `
    <div class="content-card">
      <div class="cc-thumb">
        ${i.thumbnail ? `<img src="${i.thumbnail}" onerror="this.style.display='none'">` : `<span>${typeIcons[i.type]||'📄'}</span>`}
        <span class="badge ${typeBadges[i.type]||'badge-g'}" style="position:absolute;top:8px;right:8px">${typeLabels[i.type]||'Artigo'}</span>
        <span style="position:absolute;bottom:8px;right:8px;width:8px;height:8px;border-radius:50%;background:${i.published?'var(--g)':'var(--t3)'}${i.published?';box-shadow:0 0 6px var(--g)':''}"></span>
      </div>
      <div class="cc-body">
        ${i.category ? `<div class="cc-cat">${i.category}</div>` : ''}
        <div class="cc-title">${i.title}</div>
        ${i.description ? `<div class="cc-desc">${i.description}</div>` : ''}
        <div class="cc-actions">
          <button class="btn btn-ghost btn-sm" onclick="openContentModal('${i.id}')">✏️ Editar</button>
          <button class="btn ${i.published?'btn-ghost':'btn-g'} btn-sm" onclick="toggleContentPub('${i.id}',${!i.published})">${i.published?'⬜ Rascunho':'✅ Publicar'}</button>
          <button class="btn btn-danger btn-sm" onclick="deleteContent('${i.id}')">🗑</button>
        </div>
      </div>
    </div>`) .join('') : '<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--t2)">Nenhum conteúdo encontrado</div>'}
  </div>`;
}

async function openContentModal(id) {
  let item = {};
  if (id) { const d = await apiFetch('/members-content/admin/'+id); item = d?.item || d || {}; }
  openModal(`
    <div class="modal-hdr"><div class="modal-title">${id?'Editar':'Novo'} conteúdo</div><button class="modal-x" onclick="closeModal()"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
    <div class="row2">
      <div class="fg"><label class="fl">Tipo</label><select class="fs" id="ctType"><option value="article" ${item.type==='article'?'selected':''}>📄 Artigo</option><option value="template" ${item.type==='template'?'selected':''}>📋 Template</option><option value="guide" ${item.type==='guide'?'selected':''}>📖 Guia</option><option value="video" ${item.type==='video'?'selected':''}>🎥 Vídeo</option></select></div>
      <div class="fg"><label class="fl">Categoria</label><input class="fs" id="ctCat" value="${item.category||''}" placeholder="ex: vendas, objeções"></div>
    </div>
    <div class="fg"><label class="fl">Título</label><input class="fs" id="ctTitle" value="${item.title||''}" placeholder="Título do conteúdo"></div>
    <div class="fg"><label class="fl">Descrição</label><textarea class="fs" id="ctDesc" rows="2" placeholder="Resumo que aparece no card...">${item.description||''}</textarea></div>
    <div class="fg"><label class="fl">Conteúdo</label><textarea class="fs" id="ctContent" rows="5" placeholder="Conteúdo completo...">${item.content||''}</textarea></div>
    <div class="row2">
      <div class="fg"><label class="fl">Thumbnail URL</label><input class="fs" id="ctThumb" value="${item.thumbnail||''}" placeholder="https://..."></div>
      <div class="fg"><label class="fl">Ordem</label><input class="fs" id="ctOrder" type="number" value="${item.order_index||0}"></div>
    </div>
    <div class="fg"><div class="toggle-row"><div class="tl">Publicado</div><label class="toggle-sw"><input type="checkbox" id="ctPub" ${item.published?'checked':''}><span class="tslider"></span></label></div></div>
    <div class="modal-ftr">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-g" onclick="saveContent(${id?'"'+id+'"':'null'})">Salvar</button>
    </div>`, '720px');
}

async function saveContent(id) {
  const body = { type: document.getElementById('ctType').value, category: document.getElementById('ctCat').value.trim(), title: document.getElementById('ctTitle').value.trim(), description: document.getElementById('ctDesc').value.trim(), content: document.getElementById('ctContent').value.trim(), thumbnail: document.getElementById('ctThumb').value.trim(), order_index: parseInt(document.getElementById('ctOrder').value)||0, published: document.getElementById('ctPub').checked };
  if (!body.title) { toast('Título obrigatório', 'err'); return; }
  const d = id ? await apiFetch('/members-content/admin/'+id, 'PUT', body) : await apiFetch('/members-content/admin', 'POST', body);
  if (d?.ok || d?.id || d?.item) { toast(id?'Conteúdo atualizado!':'Conteúdo criado!', 'ok'); closeModal(); renderConteudo(document.getElementById('mainContent')); }
  else toast('Erro: '+(d?.error||'?'), 'err');
}

async function toggleContentPub(id, pub) {
  await apiFetch('/members-content/admin/'+id, 'PUT', { published: pub });
  toast(pub ? 'Publicado!' : 'Movido para rascunho', 'ok');
  renderConteudo(document.getElementById('mainContent'));
}

async function deleteContent(id) {
  if (!confirm('Deletar este conteúdo?')) return;
  await apiFetch('/members-content/admin/'+id, 'DELETE');
  toast('Conteúdo deletado', 'ok');
  renderConteudo(document.getElementById('mainContent'));
}

// ── CRONS ─────────────────────────────────────────────────────────
async function renderCrons(el) {
  const crons = [
    { key: 'email-sequence', name: 'Sequência de Emails', desc: 'Dispara emails da sequência PDF (dias 2, 5, 8)', schedule: 'Todo dia 8h' },
    { key: 'onboarding', name: 'Onboarding PRO', desc: 'Emails de boas-vindas para novos membros PRO (dias 1, 3, 7)', schedule: 'Todo dia 9h' },
    { key: 'abandoned-cart', name: 'Carrinho Abandonado', desc: 'Emails de recuperação (1h e 24h após abandono)', schedule: 'A cada 30min' },
    { key: 'annual-upsell', name: 'Upsell Anual', desc: 'Oferta de upgrade para plano anual (dia 30)', schedule: 'Todo dia 10h' },
    { key: 'check-renewals', name: 'Verificar Renovações', desc: 'Desativa usuários com plano vencido e envia alerta', schedule: 'Todo dia 6h' },
    { key: 'backup', name: 'Backup do Banco', desc: 'Exporta dados críticos para armazenamento seguro', schedule: 'Todo domingo 2h' },
  ];

  el.innerHTML = `
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px">
    <div style="font-size:20px;font-weight:800">Cron Jobs</div>
    <div style="font-size:12px;color:var(--t2)">Clique em "Executar" para rodar manualmente</div>
  </div>
  <div class="cron-grid">
    ${crons.map(c => `
    <div class="cron-card">
      <div class="cron-info">
        <div class="cron-name">${c.name}</div>
        <div class="cron-desc">${c.desc}</div>
        <div style="font-size:10px;color:var(--t3);margin-top:3px">${c.schedule}</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end">
        <div class="cron-status" id="cron-dot-${c.key}"></div>
        <button class="btn btn-ghost btn-sm" onclick="runCron('${c.key}',this)">▶ Executar</button>
      </div>
    </div>`).join('')}
  </div>

  <div class="section" style="margin-top:16px">
    <div class="sec-head"><div class="sec-title">Log de execuções recentes</div></div>
    <div class="sec-body" id="cronLog" style="font-family:monospace;font-size:12px;color:var(--t2);min-height:60px">
      <div style="color:var(--t3)">Execute um cron para ver o resultado aqui...</div>
    </div>
  </div>`;
}

async function runCron(key, btn) {
  const dot = document.getElementById('cron-dot-'+key);
  const log = document.getElementById('cronLog');
  btn.disabled = true; btn.textContent = '⏳ Rodando...';
  if (dot) { dot.classList.add('running'); }
  const start = Date.now();
  try {
    const d = await apiFetch('/cron/'+key, 'POST');
    const elapsed = ((Date.now()-start)/1000).toFixed(1);
    const result = d?.message || d?.result || JSON.stringify(d);
    const line = document.createElement('div');
    line.style.cssText = 'padding:6px 0;border-bottom:1px solid var(--b)';
    line.innerHTML = `<span style="color:var(--g)">✓</span> <strong>${key}</strong> — ${result} <span style="color:var(--t3)">(${elapsed}s)</span>`;
    if (log.querySelector('div[style*="var(--t3)"]')) log.innerHTML = '';
    log.prepend(line);
    toast('Cron executado!', 'ok');
  } catch(e) {
    toast('Erro: '+e.message, 'err');
  } finally {
    btn.disabled = false; btn.textContent = '▶ Executar';
    if (dot) { dot.classList.remove('running'); }
  }
}

  const d = await apiFetch('/admin/webhooks?limit=50');
  if (!d) return;
  const logs = d.logs || d.webhooks || [];

  el.innerHTML = `
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px">
    <div style="font-size:20px;font-weight:800">Webhooks</div>
    <button class="btn btn-ghost btn-sm" onclick="renderWebhooks(document.getElementById('mainContent'))">↻ Atualizar</button>
  </div>
  <div class="section">
    <table>
      <thead><tr><th>Evento</th><th>Email</th><th>Status</th><th>Data</th><th>Detalhes</th></tr></thead>
      <tbody>${logs.map(w => `<tr>
        <td><span class="badge badge-b">${w.event_type||w.event||'—'}</span></td>
        <td style="color:var(--t2)">${w.email||w.customer_email||'—'}</td>
        <td><span class="badge ${w.processed||w.status==='ok'?'badge-g':'badge-o'}">${w.processed||w.status==='ok'?'OK':'Pendente'}</span></td>
        <td style="color:var(--t2)">${w.created_at?new Date(w.created_at).toLocaleString('pt-BR'):'—'}</td>

      </tr>`).join('')}</tbody>
    </table>
  </div>`;
}

// ── MODAL HELPERS ────────────────────────────────────────────────
function openModal(html, maxW = '560px') {
  const box = document.getElementById('modalBox');
  box.style.maxWidth = maxW;
  box.innerHTML = html;
  document.getElementById('overlay').classList.add('open');
}
function closeModal() { document.getElementById('overlay').classList.remove('open'); }
document.getElementById('overlay').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal(); });

// ── TOAST ─────────────────────────────────────────────────────────
function toast(msg, type = 'ok') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast show ' + type;
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 3000);
}

// ── UTILS ─────────────────────────────────────────────────────────
let _dt; function debounce(fn, ms) { clearTimeout(_dt); _dt = setTimeout(fn, ms); }
</script>
